spring.application.name=GLP ERP Backend
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/glprevenda_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:glprevenda_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:glprevenda_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
jwt.secret=${JWT_SECRET:desenvolvimento-secret-super-seguro-nao-usar-em-producao-123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
security.jwt.secret-key=${JWT_SECRET: desenvolvimento-secret-super-seguro-nao-usar-em-producao-123456789}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
security.jwt.expiration-time=${JWT_EXPIRATION: 86400000}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
logging.level.root=INFO
logging.level.br.com.glprevenda=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
